[package]
name = "hamseda-app"
version = "0.1.0"
description = "Hamseda desktop app (Tauri shell around the Rust core)"
edition = "2021"
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
hamseda-core = { path = "../core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
