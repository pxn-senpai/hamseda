# Release: runs when a tag like v0.2.0 is pushed. It builds the Windows installer, signs the
# update files, and publishes them with latest.json. Installed copies of Hamseda read
# latest.json to find and install the newest version.
#
# Needs one repository secret: TAURI_SIGNING_PRIVATE_KEY (the private updater key).
# The optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty for this key.
# The tag must match the version in src-tauri/tauri.conf.json (for example v0.2.0).

name: Release

on:
  push:
    tags: ["v*"]
  # Manual run from the Actions tab: rebuilds and publishes the release named in "tag".
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.2.1"
        required: true
        default: "v0.2.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript packages
        run: npm install

      - name: Clean the signing key (remove stray spaces and line breaks)
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '\r\n[:space:]')
          echo "::add-mask::$KEY"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Build, sign and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "nava ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "Windows installer. Installed copies of nava can update themselves from Settings."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis --config {"bundle":{"createUpdaterArtifacts":true}}
