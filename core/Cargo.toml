[package]
name = "hamseda-core"
version = "0.1.0"
edition = "2021"
description = "Hamseda core: TeamSpeak 3 connection layer built on tsclientlib"
license = "UNLICENSED"

[lib]
name = "hamseda_core"
path = "src/lib.rs"

[[bin]]
name = "hamseda-probe"
path = "src/bin/probe.rs"

[dependencies]
tsclientlib = "0.2"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
audiopus = "0.2"
cpal = "0.18"
slog = "2"
tsproto-packets = "0.1"
tsproto-types = "0.1"
base64 = "0.21"
